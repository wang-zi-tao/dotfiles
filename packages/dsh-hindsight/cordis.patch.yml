# dsh-hindsight bundle patch.
#
# Insert one host-side plugin row. Hooks (session/event turn/end retention,
# session/disposed flush) and the auto-recall reflect injection must be
# host-side: they observe every session. Tools are registered globally as
# well, because a
# memory bank is intentionally shared across sessions.
#
# The row config is only the starting point. The plugin merges defaults < row
# config < HINDSIGHT_* environment variables, so the same environment controls
# every profile. A later profile `cordis.patch.yml` can override the whole row
# config by id (remember: dsh patches replace the whole config, not deep-merge).

- insert:
    - id: hindsight
      name: 'dsh-hindsight'
      config:
        apiUrl: !!js process.env.HINDSIGHT_API_URL ?? 'https://api.hindsight.vectorize.io'
        apiKey: !!js process.env.HINDSIGHT_API_KEY ?? null
        bankId: !!js process.env.HINDSIGHT_BANK_ID ?? 'dsh'
        budget: !!js process.env.HINDSIGHT_BUDGET ?? 'mid'
        memoryMode: hybrid   # hybrid | context | tools
        autoRetain: true
        autoRecall: true

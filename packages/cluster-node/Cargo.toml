[package]
name = "cluster-node"
version = "0.1.0"
edition = "2021"
description = "P2P cluster membership, latency probing, route computation and HTTP/2 tunnels"
license = "MIT"

[[bin]]
name = "cluster-node"
path = "src/bin/cluster-node.rs"

[[bin]]
name = "cluster-node-cli"
path = "src/bin/cluster-node-cli.rs"

[lib]
name = "cluster_node"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
json5 = "0.4"
nix = { version = "0.30", features = ["net", "socket"] }
petgraph = "0.8"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

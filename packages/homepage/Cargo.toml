[package]
name = "homepage"
version = "0.1.0"
edition = "2021"
description = "Personal browser homepage with bookmarks, intranet links and search"
license = "MIT"

[[bin]]
name = "homepage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bcrypt = "0.17"
clap = { version = "4", features = ["derive"] }
diesel = { version = "2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
# 直接依赖以启用 bundled 特性（Diesel 通过 libsqlite3-sys 使用 SQLite）。
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
